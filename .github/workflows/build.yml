name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: python3 scripts/acceptance.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-results
          path: build/acceptance/results.json
