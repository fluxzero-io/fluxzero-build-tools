name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: packages-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          test "$RELEASE_TAG" = "v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Test both wrappers before publication
        run: python3 scripts/acceptance.py
      - name: Publish using short-lived GitHub OIDC
        run: |
          set +x
          token=$(curl --fail --silent --show-error --get \
            --data-urlencode 'audience=https://packages.fluxzero.io/publish/maven' \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value')
          echo "::add-mask::$token"
          export MAVEN_DEPLOY_TOKEN="$token"
          ./gradlew --no-daemon publishAllPublicationsToPackagesRepository
      - name: Verify anonymous downloads and checksums
        run: python3 scripts/verify-publication.py
      - name: Test both wrappers using published artifacts
        env:
          PUBLISHED_BOOTSTRAP: https://packages.fluxzero.io/maven/
        run: python3 scripts/acceptance.py
      - name: Preserve published files and create experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd build/repository && zip -qr ../maven-publication.zip .)
          gh release create "$RELEASE_TAG" build/maven-publication.zip \
            --verify-tag --prerelease --title "Fluxzero Build Tools $RELEASE_TAG" \
            --notes-file .github/release-notes.md
